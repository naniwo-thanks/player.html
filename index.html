<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- referrer を落とさない（153対策の柱） -->
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>YouTube Loop Player</title>

  <style>
    html, body { height: 100%; margin: 0; background: #000; }
    /* 16:9 を維持してレスポンシブ */
    .box { position: relative; width: 100%; padding-top: 56.25%; overflow: hidden; }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    /* 自動再生がブロックされた時の軽い案内 */
    .hint {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      color:#fff; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: rgba(0,0,0,.35); opacity:0; pointer-events:none; transition:opacity .2s;
    }
    .hint.show { opacity:1; pointer-events:auto; }
    .hint button {
      appearance:none; border:1px solid rgba(255,255,255,.7); background:transparent;
      color:#fff; padding:10px 14px; border-radius:999px;
    }
  </style>
</head>

<body>
  <div class="box">
    <iframe id="yt" referrerpolicy="strict-origin-when-cross-origin"
      allow="autoplay; encrypted-media; picture-in-picture"
      allowfullscreen></iframe>

    <div id="hint" class="hint">
      <button id="play">タップして再生</button>
    </div>
  </div>

  <script>
    const VIDEO_ID = "Th-PIM_yXMo";

    // ループに playlist=VIDEO_ID が必要
    // iPhone対策：playsinline=1 / mute=1
    // できるだけUIを消す：controls=0
    function buildSrc() {
         const params = new URLSearchParams({
      autoplay: "1",
      mute: "1",
      loop: "1",
      playlist: VIDEO_ID,
      controls: "0",
      playsinline: "1",
      rel: "0",
      modestbranding: "1",
      origin: window.location.origin,
      start: "1992" // 33分12秒（=1992秒）から開始
    });
    return `https://www.youtube-nocookie.com/embed/${VIDEO_ID}?` + params.toString();
  }

  const iframe = document.getElementById("yt");
  iframe.src = buildSrc();

  const hint = document.getElementById("hint");
  const btn  = document.getElementById("play");
  const showHintLater = () => hint.classList.add("show");

  setTimeout(showHintLater, 1500);

  btn.addEventListener("click", () => {
    hint.classList.remove("show");
    iframe.src = buildSrc(); // 再読込で起動を促す
    });
  </script>
</body>
</html>
